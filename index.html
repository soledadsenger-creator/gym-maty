<style>
:root{
  --bg:#f3f4f2; --surface:#ffffff; --ink:#1d2321; --muted:#5f6b66; --line:#d9ddd9; --grid:#e6e9e6;
  --accent:#d4561c; --accent-dark:#a8410f; --soft:#f7e6dc;
  --ok:#2f7d4f; --ok-bg:#e1f1e6; --warn:#8a5a00; --warn-bg:#fbefd2; --bad:#b3261e; --bad-bg:#f9dedb;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 64px}
body.admin .wrap{max-width:1100px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.2rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;margin-block:14px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{font-family:var(--display);font-size:1.15rem;font-weight:600;background:none;border:0;color:var(--muted);padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.item:hover{border-color:var(--accent)}
.item>div{min-width:0}
.nm{font-weight:600}
.sub{color:var(--muted);font-size:.88rem}
.chip{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.btn{font:inherit;font-weight:600;font-size:.95rem;border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;flex:1 1 150px;min-width:0}
input,textarea,select{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum b{display:block;font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.sum span{font-size:.82rem;color:var(--muted)}
.sum.bad b{color:var(--bad)} .sum.warn b{color:var(--warn)}
.gt{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.meta{color:var(--muted);font-size:.9rem}
.hint{font-size:.86rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:10px}
.note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:.93rem}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.9rem;font-weight:500;margin-bottom:12px}
.backbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:.92rem;z-index:50;max-width:90vw}
details summary{cursor:pointer;font-weight:600}
pre.msg{white-space:pre-wrap;font-family:var(--body);font-size:.95rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0}
.two{display:grid;gap:12px}
@media (min-width:900px){ body.admin .two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start} }

/* imágenes de ejercicios: dos posiciones que se alternan */
.ph{position:relative;width:60px;height:60px;border-radius:8px;overflow:hidden;background:var(--soft);flex:none}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .alt{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.ph.big{width:100%;height:auto;aspect-ratio:4/3}
.ph.none{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--accent-dark)}
.ph.big.none{font-size:2.6rem}
@media (prefers-reduced-motion:reduce){.ph .alt{animation:none;opacity:0}}
.maq{width:100%;max-height:320px;object-fit:contain;background:var(--bg);border-radius:10px;display:block}
.maq-mini{width:60px;height:60px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg)}
.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;display:block}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.badge.on{background:var(--soft);border-color:var(--soft);color:var(--accent-dark)}

.rl{display:flex;gap:10px;align-items:center}
.rl>div{min-width:0}
.day{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.day:first-of-type{border-top:0;padding-top:0}

/* editor */
.it{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.it-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.it-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:700px){.it-f{grid-template-columns:repeat(4,minmax(0,1fr))}}
.it-f label{font-size:.7rem}
.it-f input{padding:7px 8px}
.it-ctl{display:flex;flex-direction:column;gap:4px}
.it-ctl .btn{min-height:34px;padding:4px 10px}

/* selector y biblioteca */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.sheet-head{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-head .btn.ghost{color:#cfd6d2}
.sheet-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.sheet-in{max-width:1100px;margin:0 auto}
.sheet-foot{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.gchip{font:inherit;font-size:.9rem;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.gchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.pcard{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pcard[aria-pressed="true"]{border-color:var(--accent)}
.pcard.off{opacity:.55}
.pcard .tag{font-size:.8rem;font-weight:600;color:var(--muted)}
.pcard[aria-pressed="true"] .tag{color:var(--accent)}

/* alumno */
.al-banner{background:var(--accent);color:#fff;padding:10px 16px;font-weight:600;font-size:.95rem;border-radius:10px}
.al-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.al-day{font:inherit;cursor:pointer;padding:8px 6px;min-height:54px;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.al-day[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.al-day b{display:block;font-family:var(--display);font-size:1.15rem}
.al-day span{display:block;font-size:.78rem}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ex.hecho{border-color:var(--ok)}
.ex>.ph.big{border-radius:0}
.ex-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.ex-carga{font-family:var(--display);font-weight:700;font-size:1.35rem;color:var(--accent-dark);font-variant-numeric:tabular-nums;line-height:1.1}
.ex-desc{font-size:.92rem;color:var(--ink);font-weight:500}
.ex-nota{font-weight:600;font-size:.95rem}
.ex-tip{color:var(--muted);font-size:.92rem;white-space:pre-line}
.ex-num{font-family:var(--display);font-weight:700;color:var(--muted)}
.hecho-btn{align-self:flex-start}
.hecho-btn[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--accent-dark);flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px}
.kv b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.kv span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:.86rem;color:var(--muted);min-height:1.3em}
table.regs{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
table.regs th,table.regs td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.regs th:first-child,table.regs td:first-child{text-align:left}
table.regs th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto}
/* pantalla de inicio */
#splash{position:fixed;inset:0;z-index:100;background:#1d2321;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;cursor:pointer;transition:opacity .5s ease;padding:24px}
#splash.fuera{opacity:0;pointer-events:none}
#splash svg{width:min(260px,64vw);height:auto;overflow:visible}
#splash .barra{animation:levantar 1.1s cubic-bezier(.3,1.4,.5,1) both .1s}
#splash .disco{transform-box:fill-box;transform-origin:center;animation:disco .45s ease-out both}
#splash .marca{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,11vw,4.4rem);letter-spacing:.05em;line-height:1;display:flex;overflow:hidden;padding-bottom:4px}
#splash .marca span{display:inline-block;animation:letra .5s cubic-bezier(.2,.8,.2,1) both}
#splash .marca .ac{color:var(--accent)}
#splash .lema{font-size:.85rem;color:#b9c2bd;letter-spacing:.2em;text-transform:uppercase;animation:aparecer .6s ease both 1.5s;text-align:center}
#splash .linea{width:0;height:3px;background:var(--accent);border-radius:2px;animation:linea .7s ease both 1.2s}
@keyframes levantar{0%{transform:translateY(80px);opacity:0}15%{opacity:1}60%{transform:translateY(-10px)}100%{transform:translateY(0)}}
@keyframes disco{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes letra{from{transform:translateY(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes linea{to{width:min(180px,40vw)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .linea{width:min(180px,40vw)}}
</style>
</head>

/* ========================================================= */

function estado(al){
  if(al.activo===false) return {k:'none', txt:'De baja', dias:null};
  const r = al.rutina;
  if(!r) return {k:'none', txt:'Sin rutina', dias:null};
  const d = daysBetween(today(), vence(r));
  if(d < 0) return {k:'bad', txt:`Vencida hace ${-d} d`, dias:d};
  if(d <= 7) return {k:'warn', txt: d===0 ? 'Vence hoy' : `Vence en ${d} d`, dias:d};
  return {k:'ok', txt:`Al día · ${d} d`, dias:d};
}
function cargaTxt(it){
  const sr = it.series && it.reps ? `${it.series} × ${it.reps}` : (it.series || it.reps || '');
  const peso = it.carga ? it.carga : (SIN_CARGA.includes(it.grupo) ? '' : 'sin peso');
  return [sr, peso].filter(Boolean).join(' · ');
}

const FOTOS = {}; const FOTO_PEND = {};
function cargarFotos(root){
  (root||document).querySelectorAll('img[data-foto]').forEach(img => {
    const k = img.dataset.foto;
    if(FOTOS[k]){ img.src = FOTOS[k]; return; }
    if(FOTOS[k]===null) return;
    if(!FOTO_PEND[k]) FOTO_PEND[k] = Data.get('fotos', k).then(d => { FOTOS[k] = d && d.img ? d.img : null; return FOTOS[k]; }).catch(()=>{ FOTOS[k]=null; return null; });
    FOTO_PEND[k].then(src => { if(src) document.querySelectorAll(`img[data-foto="${CSS.escape(k)}"]`).forEach(i=>i.src=src); });
  });
}
function comprimir(file, max, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const k = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

/* ---------------- gráfico de progreso (una serie) ---------------- */
function chartHTML(regs, campo, cid){
  const [, label, unidad] = CAMPOS.find(c=>c[0]===campo);
  const pts = (regs||[]).map(r=>({f:r.fecha, v:num(r[campo])})).filter(p=>p.f && p.v!=null).sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0);
  if(pts.length < 2) return `<div class="hint">Con dos registros o más de ${label.toLowerCase()} aparece el gráfico de evolución.</div>`;
  const W=600, H=230, L=46, R=70, T=18, B=30;
  let mn = Math.min(...pts.map(p=>p.v)), mx = Math.max(...pts.map(p=>p.v));
  const padv = Math.max((mx-mn)*0.2, 1); mn -= padv; mx += padv;
  const t0 = new Date(pts[0].f+'T12:00:00').getTime(), t1 = new Date(pts[pts.length-1].f+'T12:00:00').getTime();
  const X = f => L + (t1===t0 ? (W-L-R)/2 : (new Date(f+'T12:00:00').getTime()-t0)/(t1-t0)*(W-L-R));
  const Y = v => T + (1-(v-mn)/(mx-mn))*(H-T-B);
  const ticks = [0,1,2,3].map(i => mn + (mx-mn)*i/3);
  const path = pts.map((p,i)=>`${i?'L':'M'}${X(p.f).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const last = pts[pts.length-1], first = pts[0];
  const diff = last.v - first.v;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} a lo largo del tiempo, de ${fmtNum(first.v)} a ${fmtNum(last.v)} ${unidad}">`;
  ticks.forEach(v => { const y=Y(v).toFixed(1); s += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${L-8}" y="${y}" dy="4" text-anchor="end" font-size="12" fill="var(--muted)">${fmtNum(v)}</text>`; });
  s += `<text x="${L}" y="${H-8}" font-size="12" fill="var(--muted)">${fmtCorto(first.f)}</text><text x="${W-R}" y="${H-8}" font-size="12" fill="var(--muted)" text-anchor="end">${fmtCorto(last.f)}</text>`;
  s += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i) => { const x=X(p.f).toFixed(1), y=Y(p.v).toFixed(1), end=i===pts.length-1;
    s += `<circle cx="${x}" cy="${y}" r="${end?5:4}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    s += `<circle cx="${x}" cy="${y}" r="16" fill="transparent" data-tip="${esc(fmt(p.f)+' · '+fmtNum(p.v)+' '+unidad)}" data-cap="${cid}" style="cursor:pointer"><title>${esc(fmt(p.f)+': '+fmtNum(p.v)+' '+unidad)}</title></circle>`; });
  s += `<text x="${(X(last.f)+10).toFixed(1)}" y="${Y(last.v).toFixed(1)}" dy="4" font-size="14" font-weight="600" fill="var(--ink)">${fmtNum(last.v)} ${unidad}</text></svg>`;
  const signo = diff>0 ? '+' : diff<0 ? '−' : '';
  return `<div class="chart"><div class="meta" style="margin-bottom:4px">${signo}${fmtNum(Math.abs(diff))} ${unidad} desde el ${fmtCorto(first.f)}</div>${s}<div class="cap" id="${cid}">Tocá un punto para ver el valor</div></div>`;
}
function tablaRegs(regs, borrable){
  const rs = (regs||[]).map((r,i)=>({...r,_i:i})).sort((a,b)=>a.fecha<b.fecha?1:-1);
  if(!rs.length) return '';
  return `<div class="tablewrap"><table class="regs"><thead><tr><th>Fecha</th>${CAMPOS.map(c=>`<th>${c[1]}</th>`).join('')}${borrable?'<th></th>':''}</tr></thead><tbody>
    ${rs.map(r=>`<tr><td>${fmt(r.fecha)}</td>${CAMPOS.map(c=>`<td>${num(r[c[0]])==null?'—':fmtNum(num(r[c[0]]))}</td>`).join('')}${borrable?`<td><button class="btn ghost sm danger" data-act="borrarReg" data-i="${r._i}" aria-label="Borrar registro del ${fmt(r.fecha)}">✕</button></td>`:''}</tr>`).join('')}
  </tbody></table></div>`;
}
function ultimos(regs){
  const out = {};
  CAMPOS.forEach(([c]) => { const rs=(regs||[]).filter(r=>num(r[c])!=null).sort((a,b)=>a.fecha<b.fecha?-1:1); if(rs.length) out[c]=num(rs[rs.length-1][c]); });
  return out;
}

const DEMO = !firebaseConfig;
let fs=null, auth=null;
if(!DEMO){ firebase.initializeApp(firebaseConfig); fs=firebase.firestore(); auth=firebase.auth(); }
const DEMO_KEY='gymmaty_demo_v2';
let demoData=null; const demoSubs=[];
function demoInit(){
  if(demoData) return;
  try{ demoData = JSON.parse(lsGet(DEMO_KEY)); }catch(e){ demoData=null; }
  if(!demoData){ demoData = seedDemo(); lsSet(DEMO_KEY, JSON.stringify(demoData)); }
}
function demoGuardar(col){ lsSet(DEMO_KEY, JSON.stringify(demoData)); demoSubs.filter(s=>s.col===col).forEach(s=>s.f()); }
const Data = {
  watch(col, cb){
    if(DEMO){ demoInit(); const f=()=>cb(clone(demoData[col]||{})); demoSubs.push({col,f}); f(); return ()=>{}; }
    return fs.collection(col).onSnapshot(s=>{ const m={}; s.forEach(d=>m[d.id]=d.data()); cb(m); }, e=>{ console.error(col, e); cb({}); });
  },
  watchDoc(col, id, cb){
    if(DEMO){ demoInit(); const f=()=>cb(demoData[col] && demoData[col][id] ? clone(demoData[col][id]) : null); const sub={col,f}; demoSubs.push(sub); f(); return ()=>{ const i=demoSubs.indexOf(sub); if(i>=0) demoSubs.splice(i,1); }; }
    return fs.collection(col).doc(id).onSnapshot(d=>cb(d.exists ? d.data() : null), e=>{ console.error(col, e); cb(null); });
  },
  async get(col, id){
    if(DEMO){ demoInit(); return demoData[col] && demoData[col][id] ? clone(demoData[col][id]) : null; }
    const d = await fs.collection(col).doc(id).get(); return d.exists ? d.data() : null;
  },
  async set(col, id, data){
    data = clone(data);
    if(DEMO){ demoInit(); (demoData[col] = demoData[col] || {})[id] = data; demoGuardar(col); return; }
    await fs.collection(col).doc(id).set(data);
  },
  async del(col, id){
    if(DEMO){ demoInit(); if(demoData[col]) delete demoData[col][id]; demoGuardar(col); return; }
    await fs.collection(col).doc(id).delete();
  }
};
async function guardar(col, id, data, ok){
  try{ await Data.set(col, id, data); if(ok) toast(ok); return true; }
  catch(e){ console.error(e); toast(String(e && e.code||'').includes('resource') || String(e&&e.message||'').includes('size') ? 'La foto es muy pesada. Probá con otra.' : 'No se pudo guardar. Revisá la conexión.'); return false; }
}

  const out = [];

    out.push({key, base:true, nombre:o.nombre||e.nombre, grupo:o.grupo||e.grupo, img:e.img, tip:(o.tip!=null && o.tip!=='') ? o.tip : e.tip, video:o.video||'', tieneFoto:!!o.tieneFoto, oculto:!!o.oculto, editado:!!EXDOCS[key]}); });

function header(){
  return `${DEMO?`<div class="demo">Modo demostración: los datos quedan solo en este navegador. Cuando se conecte Firebase, se guardan en línea.</div>`:''}
  <div class="top"><h1>${esc(GIMNASIO)}</h1>${S.user?`<button class="btn ghost sm" data-act="logout">Salir</button>`:''}</div>
  <nav class="tabs" role="tablist">
    ${[['panel','Panel'],['alumnos','Alumnos'],['plantillas','Plantillas'],['ejercicios','Ejercicios']].map(([k,n])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k && !S.screen}">${n}</button>`).join('')}
  </nav>`;
}
function renderAdmin(){
  if(!S.ready){ $app.innerHTML = header() + `<div class="empty">Cargando…</div>`; return; }
  const s = S.screen; let body = '';
  if(s && s.type==='alumno') body = vAlumno(s.id);
  else if(s && s.type==='editAlumno') body = vEditAlumno(s.id);
  else if(s && s.type==='editRutina') body = vEditRutina(s);
  else if(s && s.type==='avisar') body = vAvisar(s);
  else if(s && s.type==='editEj') body = vEditEj(s);
  else if(S.tab==='panel') body = vPanel();
  else if(S.tab==='alumnos') body = vAlumnos();
  else if(S.tab==='plantillas') body = vPlantillas();
  else body = vEjercicios();
  $app.innerHTML = header() + body;
  if(s && s.type==='avisar') actualizarAviso();
  cargarFotos($app);
}

function vPanel(){
  const al = lista().filter(a=>a.activo!==false);
  if(!al.length) return `<div class="stack"><div class="empty">Todavía no hay alumnos cargados.<br>Empezá armando una plantilla y después cargá a tus alumnos.</div>
    <div class="row"><button class="btn primary" data-act="nuevoAlumno">Nuevo alumno</button><button class="btn" data-tab="plantillas">Ver plantillas</button></div></div>`;
  const venc = al.filter(a=>estado(a).k==='bad').sort((a,b)=>estado(a).dias-estado(b).dias);
  const sem = al.filter(a=>estado(a).k==='warn').sort((a,b)=>estado(a).dias-estado(b).dias);
  const sin = al.filter(a=>!a.rutina);
  const g = (t,arr,vacio) => `<div class="gt">${t}</div>` + (arr.length ? arr.map(itemAlumno).join('') : `<div class="hint">${vacio}</div>`);
  return `<div class="stack">
    <div class="summary"><div class="sum bad"><b>${venc.length}</b><span>vencidas</span></div><div class="sum warn"><b>${sem.length}</b><span>vencen en 7 días</span></div><div class="sum"><b>${al.length}</b><span>alumnos activos</span></div></div>
    ${g('Renovar ya', venc, 'Ninguna rutina vencida.')}
    ${g('Vencen esta semana', sem, 'Nada vence en los próximos 7 días.')}
    ${sin.length ? g('Sin rutina asignada', sin, '') : ''}
  </div>`;
}
function listaAlumnosHTML(){
  const q = sinTildes(S.q);
  const al = lista().filter(a=>!q || sinTildes(a.nombre).includes(q));
  const act = al.filter(a=>a.activo!==false), baja = al.filter(a=>a.activo===false);
  if(!al.length) return `<div class="empty">${q?'No hay alumnos con ese nombre.':'Todavía no hay alumnos. Tocá “Nuevo alumno”.'}</div>`;
  return act.map(itemAlumno).join('') + (baja.length ? `<div class="gt">Dados de baja</div>` + baja.map(itemAlumno).join('') : '');
}
function vAlumnos(){
  return `<div class="stack">
    <div class="row" style="align-items:flex-end"><label style="flex:1 1 220px" for="q">Buscar<input id="q" type="search" value="${esc(S.q)}" placeholder="Nombre del alumno" autocomplete="off"></label>
    <button class="btn primary" data-act="nuevoAlumno">Nuevo alumno</button></div>
    <div class="stack" id="listaAl">${listaAlumnosHTML()}</div></div>`;
}
function vPlantillas(){
  const pl = Object.entries(S.plantillas).map(([id,p])=>({id,...p})).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return `<div class="stack">
    <div class="note">Las plantillas son las rutinas base. Se arman una vez y después se asignan a cada alumno con un toque, ajustando lo que haga falta.</div>
    <div class="row"><button class="btn primary" data-act="nuevaPlantilla">Nueva plantilla</button></div>
    ${pl.length ? pl.map(p=>`<button class="item" data-plantilla="${esc(p.id)}"><div><div class="nm">${esc(p.nombre)}</div><div class="sub">${(p.dias||[]).length} días · ${esc(p.semanas)} semanas · ${(p.dias||[]).reduce((n,d)=>n+(d.items||[]).length,0)} ejercicios</div></div><span class="chip none">Editar</span></button>`).join('')
      : `<div class="empty">Sin plantillas todavía. Creá la primera, por ejemplo “Hipertrofia 3 días”.</div>`}
  </div>`;
}
function ejCard(e, attr){
  return `<button class="pcard${e.oculto?' off':''}" ${attr}>${e.img?thumb(e,true):(e.tieneFoto?`<div class="ph big"><img data-foto="${esc(e.key)}" alt=""></div>`:thumb(e,true))}
    <div class="nm" style="font-size:.95rem;line-height:1.2">${esc(e.nombre)}</div>
    <div class="badges"><span class="badge">${esc(e.grupo)}</span>${e.tieneFoto?'<span class="badge on">Foto máquina</span>':''}${urlOk(e.video)?'<span class="badge on">Video</span>':''}${!e.base?'<span class="badge">Propio</span>':''}${e.oculto?'<span class="badge">De baja</span>':''}</div></button>`;
}
function ejFiltrados(conBajas){
  const q = sinTildes(S.exq);
  return LIB(conBajas).filter(e => (S.exg==='Todos' || (S.exg==='Propios' ? !e.base : e.grupo===S.exg)) && (!q || sinTildes(e.nombre).includes(q)));
}
function vEjercicios(){
  const items = ejFiltrados(S.exBajas);
  return `<div class="stack">
    <div class="note">Tocá un ejercicio para cambiarle el nombre, la explicación, la foto de la máquina o el video. Los cambios se ven en las rutinas de todos los alumnos.</div>
    <div class="row" style="align-items:flex-end"><label style="flex:1 1 220px" for="exq">Buscar<input id="exq" type="search" value="${esc(S.exq)}" placeholder="Ej: sentadilla" autocomplete="off"></label>
      <button class="btn primary" data-act="nuevoEj">Nuevo ejercicio</button></div>
    <div class="chips">${['Todos',...GRUPOS,'Propios'].map(g=>`<button class="gchip" data-exg="${esc(g)}" aria-pressed="${S.exg===g}">${esc(g)}</button>`).join('')}</div>
    <label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:500"><input type="checkbox" id="exBajas" style="width:auto" ${S.exBajas?'checked':''}> Mostrar también los dados de baja</label>
    <div class="pgrid" id="exGrid">${items.map(e=>ejCard(e, `data-ej="${esc(e.key)}"`)).join('') || ''}</div>
    ${items.length?'':`<div class="empty">No hay ejercicios con ese filtro.</div>`}
  </div>`;
}
function vEditEj(s){
  const d = s.draft;
  const base = d.base ? EJERCICIOS.find(e=>'f:'+e.img===d.key) : null;

  return `<form class="stack" id="fEj">
    <div class="backbar"><button type="button" class="btn ghost" data-back>← Volver</button>
      <div class="row">${d.key?`<button type="button" class="btn sm" data-act="bajaEj">${d.oculto?'Volver a dar de alta':'Dar de baja'}</button>`:''}
      ${d.key && !d.base?`<button type="button" class="btn ghost sm danger" data-act="borrarEj">${S.confirmDel===d.key?'Tocá de nuevo para borrar':'Borrar'}</button>`:''}
      ${d.base && d.editado?`<button type="button" class="btn ghost sm" data-act="restaurarEj">${S.confirmDel===d.key?'Tocá de nuevo para confirmar':'Volver al original'}</button>`:''}</div></div>
    <h2>${d.key?'Editar ejercicio':'Nuevo ejercicio'}</h2>

    <div class="two">
      <div class="stack">
        <div class="grid3">
          <label for="ej-n">Nombre<input id="ej-n" data-x="nombre" required value="${esc(d.nombre)}" placeholder="Ej: Pipito"></label>
          <label for="ej-g">Grupo muscular<select id="ej-g" data-x="grupo">${GRUPOS.map(g=>`<option ${g===d.grupo?'selected':''}>${esc(g)}</option>`).join('')}</select></label>
        </div>
        <label for="ej-t">Cómo se hace (lo ve el alumno)<textarea id="ej-t" data-x="tip" placeholder="Postura, recorrido, errores a evitar…">${esc(d.tip)}</textarea></label>
        <label for="ej-v">Link del video<input id="ej-v" data-x="video" value="${esc(d.video)}" placeholder="https://youtu.be/…  o link de Instagram / TikTok"></label>
        <div class="hint">Los videos de YouTube se ven dentro de la app. Para un video propio, subilo a YouTube como “no listado” y pegá el link.</div>
        <div id="vidPrev">${urlOk(d.video)?videoHTML(d.video):''}</div>
      </div>
      <div class="stack">
        ${base?`<div class="card stack"><div class="gt" style="margin:0">Imagen de referencia</div>${thumb(base,true)}</div>`:''}
        <div class="card stack"><div class="gt" style="margin:0">Foto de la máquina o del ejercicio</div>
          ${fotoSrc ? `<img class="maq" src="${esc(fotoSrc)}" alt="">` : (fotoSrc===null ? `<img class="maq" data-foto="${esc(d.key)}" alt="">` : `<div class="empty">Sin foto todavía</div>`)}
          <div class="row"><button type="button" class="btn" data-act="fotoEj">${(fotoSrc||fotoSrc===null)?'Cambiar foto':'Subir foto'}</button>${(fotoSrc||fotoSrc===null)?`<button type="button" class="btn ghost danger sm" data-act="quitarFotoEj">Quitar</button>`:''}</div>
          <div class="hint">Desde la compu elegís el archivo; desde el celu podés sacarla en el momento.</div>
        </div>
      </div>
    </div>
    <div class="row"><button class="btn primary" type="submit">Guardar ejercicio</button></div>
  </form>`;
}
function rutinaResumen(r){
  return `<div class="stack">${(r.dias||[]).map((d,i)=>`<div class="day"><h3>Día ${i+1} · ${esc(d.titulo)}</h3>
    ${(d.items||[]).map(resolver).map(it=>`<div class="rl">${it.img||!it.tieneFoto?thumb(it):`<img class="maq-mini" data-foto="${esc(it.key)}" alt="">`}<div><div class="nm">${esc(it.nombre)}</div><div class="sub">${esc(cargaTxt(it))}${it.descanso?' · descanso '+esc(it.descanso):''}${it.nota?' · '+esc(it.nota):''}</div></div></div>`).join('') || '<div class="hint">Sin ejercicios</div>'}
  </div>`).join('')}${r.notas?`<div class="meta">Notas: ${esc(r.notas)}</div>`:''}</div>`;
}
function vAlumno(id){
  const a = S.alumnos[id]; if(!a){ S.screen=null; return vPanel(); }
  const e = estado(a), r = a.rutina, hist = (a.historial||[]).slice().reverse(), pf = perfilDe(a);
  const plOpts = Object.entries(S.plantillas).map(([pid,p])=>`<option value="${esc(pid)}">${esc(p.nombre)}</option>`).join('');
  const baja = a.activo===false;
  const ed = pf ? edad(pf.nacimiento) : null;
  return `<div class="stack">
    <div class="backbar"><button class="btn ghost" data-back>← Volver</button><div class="row"><button class="btn sm" data-act="editAlumno">Editar datos</button><button class="btn sm" data-act="bajaAlumno">${baja?'Dar de alta de nuevo':'Dar de baja'}</button></div></div>
    <div class="row">${pf?avatarHTML(pf):`<div class="avatar" aria-hidden="true">${esc(iniciales(a.nombre))}</div>`}<div><h2>${esc(a.nombre)}</h2><div class="meta">${[a.objetivo, a.telefono, a.alta?'Alta '+fmt(a.alta):''].filter(Boolean).map(esc).join(' · ')}</div></div></div>
    ${baja?`<div class="note">Dado de baja: su link muestra que el acceso está pausado. Se conserva todo su historial.</div>`:''}
    ${a.observaciones?`<div class="note">${esc(a.observaciones)}</div>`:''}
    <div class="two">
      <div class="stack">
        <div class="card stack">
          <div class="backbar"><div><h3>${r?esc(r.nombre):'Sin rutina'}</h3>${r?`<div class="meta">Desde ${fmt(r.inicio)} · ${esc(r.semanas)} semanas · renovar el ${fmt(vence(r))}</div>`:''}</div><span class="chip ${e.k}">${e.txt}</span></div>
          ${r ? rutinaResumen(r) : `<div class="hint">Asigná una plantilla o armá una rutina desde cero.</div>`}
          <div class="row">${r?`<button class="btn primary" data-act="renovar">Renovar rutina</button><button class="btn" data-act="ajustar">Ajustar</button>`:''}
            <button class="btn${r?'':' primary'}" data-act="desdeCero">${r?'Nueva desde cero':'Armar desde cero'}</button></div>
          ${plOpts?`<div class="row" style="align-items:flex-end"><label style="flex:1 1 180px" for="selPl">Asignar plantilla<select id="selPl">${plOpts}</select></label><button class="btn" data-act="asignar">Asignar</button></div>`:''}
        </div>
        <div class="card stack"><h3>Historial de rutinas</h3>
          ${hist.length ? hist.map(h=>`<details><summary>${esc(h.nombre)} <span class="meta">· ${fmt(h.inicio)} al ${fmt(h.fin)}</span></summary><div style="margin-top:10px">${rutinaResumen(h)}</div></details>`).join('') : `<div class="hint">Cuando renueves la rutina, la anterior queda guardada acá.</div>`}
        </div>
      </div>
      <div class="stack">
        <div class="card stack"><h3>Link del alumno</h3>
          <input readonly id="linkAl" value="${esc(linkAlumno(a.token))}" aria-label="Link del alumno">
          <div class="row"><button class="btn sm" data-act="copiarLink">Copiar link</button><a class="btn sm" href="${esc(linkAlumno(a.token))}" target="_blank" rel="noopener">Ver como alumno</a>
          ${r&&!baja?`<button class="btn dark sm" data-act="avisar">Avisar por WhatsApp</button>`:''}</div>
        </div>
        <div class="card stack"><h3>Progreso y datos del alumno</h3>
          ${pf ? `<div class="kv">${ed?`<div><span>Edad</span><b>${ed}</b></div>`:''}${pf.altura?`<div><span>Altura</span><b>${esc(pf.altura)} cm</b></div>`:''}${CAMPOS.map(c=>{const u=ultimos(pf.registros)[c[0]];return u!=null?`<div><span>${c[1]}</span><b>${fmtNum(u)} ${c[2]}</b></div>`:''}).join('')}</div>
            ${pf.molestias?`<div class="note"><b>Molestias que reportó:</b> ${esc(pf.molestias)}</div>`:''}
            ${pf.emergencia?`<div class="meta">Emergencia: ${esc(pf.emergencia)}</div>`:''}
            <div class="chips">${CAMPOS.map(c=>`<button class="gchip" data-metric="${c[0]}" aria-pressed="${S.metric===c[0]}">${c[1]}</button>`).join('')}</div>
            ${chartHTML(pf.registros, S.metric, 'capP')}
            ${(pf.registros||[]).length?`<details><summary>Ver todos los registros</summary><div style="margin-top:8px">${tablaRegs(pf.registros,false)}</div></details>`:''}`
          : `<div class="hint">Todavía no creó su usuario. Cuando entre a su link y toque “Mi progreso”, va a poder cargar su foto, peso y medidas, y vas a verlos acá.</div>`}
        </div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost danger" data-act="borrarAlumno">${S.confirmDel===id?'Tocá de nuevo para borrar todo':'Borrar alumno definitivamente'}</button></div>
  </div>`;
}

    <div class="backbar"><button type="button" class="btn ghost" data-back>← Cancelar</button></div>
    <h2>${id?'Editar alumno':'Nuevo alumno'}</h2>
    <div class="grid3">
      <label for="al-nombre">Nombre y apellido<input id="al-nombre" required value="${esc(a.nombre)}"></label>

function rutinaVacia(){ return {nombre:'', semanas:4, notas:'', dias:[{titulo:'Día 1',items:[]},{titulo:'Día 2',items:[]},{titulo:'Día 3',items:[]}]}; }
function vEditRutina(s){

  const al = esPl ? null : S.alumnos[s.id];
  const titulo = esPl ? (s.id?'Editar plantilla':'Nueva plantilla') : (s.archivar ? 'Renovar rutina · ' + esc(al.nombre) : 'Rutina de ' + esc(al.nombre));
  return `<form class="stack" id="fR">
    <div class="backbar"><button type="button" class="btn ghost" data-back>← Cancelar</button>
      ${esPl && s.id ? `<button type="button" class="btn ghost danger" data-act="borrarPlantilla">${S.confirmDel===s.id?'Tocá de nuevo para borrar':'Borrar plantilla'}</button>`:''}</div>
    <h2>${titulo}</h2>
    ${s.archivar?`<div class="note">La rutina anterior queda guardada en el historial. Arrancás con una copia para ajustar.</div>`:''}
    <div class="grid3">
      <label for="r-nombre">Nombre de la rutina<input id="r-nombre" data-r="nombre" required value="${esc(r.nombre)}" placeholder="Hipertrofia 3 días"></label>
      ${esPl?'':`<label for="r-inicio">Empieza el<input id="r-inicio" data-r="inicio" type="date" value="${esc(r.inicio||today())}"></label>`}
      <label for="r-sem">Duración (semanas)<input id="r-sem" data-r="semanas" type="number" min="1" max="16" inputmode="numeric" value="${esc(r.semanas||4)}"></label>
    </div>
    ${(r.dias||[]).map((d,di)=>`<div class="card stack">
      <div class="row" style="align-items:flex-end"><label style="flex:1 1 160px" for="dt-${di}">Día ${di+1}<input id="dt-${di}" data-dt="${di}" value="${esc(d.titulo)}" placeholder="Piernas, Empuje…"></label>
      <button type="button" class="btn ghost danger sm" data-act="quitarDia" data-d="${di}">Quitar día</button></div>
      ${(d.items||[]).map((raw,ii)=>{ const it=resolver(raw); return `<div class="it">${it.img||!it.tieneFoto?thumb(it):`<img class="maq-mini" data-foto="${esc(it.key)}" alt="">`}<div class="it-main">
          <div class="row" style="justify-content:space-between"><div class="nm">${esc(it.nombre)}</div><div class="badges">${it.tieneFoto?'<span class="badge on">Foto máquina</span>':''}${urlOk(it.video)?'<span class="badge on">Video</span>':''}</div></div>
          <div class="it-f">
            <label for="s-${di}-${ii}">Series<input id="s-${di}-${ii}" data-d="${di}" data-i="${ii}" data-f="series" inputmode="numeric" value="${esc(it.series)}"></label>
            <label for="p-${di}-${ii}">Repeticiones<input id="p-${di}-${ii}" data-d="${di}" data-i="${ii}" data-f="reps" value="${esc(it.reps)}"></label>
            <label for="c-${di}-${ii}">Peso<input id="c-${di}-${ii}" data-d="${di}" data-i="${ii}" data-f="carga" value="${esc(it.carga)}" placeholder="Sin peso"></label>
            <label for="ds-${di}-${ii}">Descanso<input id="ds-${di}-${ii}" data-d="${di}" data-i="${ii}" data-f="descanso" value="${esc(it.descanso)}" placeholder="60 s"></label>
          </div>
          <input aria-label="Nota para el alumno" id="n-${di}-${ii}" data-d="${di}" data-i="${ii}" data-f="nota" value="${esc(it.nota)}" placeholder="Nota para el alumno (opcional)">
        </div><div class="it-ctl">
          <button type="button" class="btn sm" data-act="subir" data-d="${di}" data-i="${ii}" aria-label="Subir" ${ii===0?'disabled':''}>↑</button>
          <button type="button" class="btn sm" data-act="bajar" data-d="${di}" data-i="${ii}" aria-label="Bajar" ${ii===d.items.length-1?'disabled':''}>↓</button>
          <button type="button" class="btn sm danger" data-act="quitarIt" data-d="${di}" data-i="${ii}" aria-label="Quitar">✕</button>
        </div></div>`; }).join('')}
      <button type="button" class="btn" data-act="abrirPicker" data-d="${di}">+ Agregar ejercicios</button>
    </div>`).join('')}
    <div class="row"><button type="button" class="btn" data-act="agregarDia">+ Agregar día</button></div>
    <label for="r-notas">Notas generales (las ve el alumno)<textarea id="r-notas" data-r="notas" style="min-height:60px" placeholder="Entrada en calor, hidratación…">${esc(r.notas||'')}</textarea></label>
    <div class="row"><button class="btn primary" type="submit">${esPl?'Guardar plantilla':(s.archivar?'Guardar renovación':'Guardar rutina')}</button></div>
  </form>`;
}

/* ---- aviso por WhatsApp ---- */
function waNumero(tel){ let d=String(tel||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('0')) d=d.slice(1); if(d.length===10) d='549'+d; return d.length>=12 ? d : ''; }
function mensajeAviso(a, primera, cambio){
  const r = a.rutina;
  let m = `¡Hola ${primerNombre(a.nombre)}! ${primera ? 'Ya tenés tu rutina armada.' : 'Te actualicé la rutina.'}\n\n*${r.nombre}*, vigente hasta el ${fmt(vence(r))}.\n`;
  if(cambio && cambio.trim()) m += `\nQué cambió: ${cambio.trim()}\n`;
  m += `\nMirala acá (cada ejercicio tiene su foto y cómo se hace):\n${linkAlumno(a.token)}\n\nCualquier duda me escribís. ¡A darle!\n${PROFE}`;
  return m;
}
function vAvisar(s){
  const a = S.alumnos[s.id];
  return `<div class="stack" style="max-width:640px">
    <div class="backbar"><button class="btn ghost" data-back>← Ahora no</button></div>
    <h2>Avisarle a ${esc(primerNombre(a.nombre))}</h2>
    <label for="cambio">Qué cambió (opcional)<input id="cambio" value="${esc(s.cambio||'')}" placeholder="Ej: subimos la carga en sentadilla y sumamos estocadas"></label>
    <div class="gt">Así le llega</div>
    <pre class="msg" id="msgPrev"></pre>
    <div class="row"><a class="btn primary" id="waBtn" target="_blank" rel="noopener" href="#">Enviar por WhatsApp</a><button class="btn" data-act="copiarMsg">Copiar mensaje</button></div>
    ${waNumero(a.telefono)?'':`<div class="hint">No tiene celular cargado con código de área: WhatsApp te va a pedir elegir el contacto.</div>`}
  </div>`;
}
function actualizarAviso(){
  const s = S.screen, a = S.alumnos[s.id], msg = mensajeAviso(a, s.primera, s.cambio);
  const pre = document.getElementById('msgPrev'); if(pre) pre.textContent = msg;
  const btn = document.getElementById('waBtn'); if(btn) btn.href = `https://wa.me/${waNumero(a.telefono)}?text=${encodeURIComponent(msg)}`;
}

/* ---- selector de ejercicios ---- */
function abrirPicker(di){ S.picker = {dia:di, sel:[], grupo:'Todos', q:'', crear:false}; $sheet.hidden=false; document.body.style.overflow='hidden'; renderPicker(); }
function cerrarPicker(){ S.picker=null; $sheet.hidden=true; $sheet.innerHTML=''; document.body.style.overflow=''; }
function renderPicker(){
  const p = S.picker;
  $sheet.innerHTML = `<div class="sheet-head"><div><div style="font-size:.8rem;color:#b9c2bd;text-transform:uppercase;letter-spacing:.06em">Agregar al día ${p.dia+1}</div><h2 style="color:#fff">Elegí ejercicios</h2></div><button class="btn ghost" data-act="cerrarPicker">Cancelar</button></div>
  <div class="sheet-body"><div class="sheet-in">
    <label for="pq">Buscar<input id="pq" type="search" value="${esc(p.q)}" placeholder="Ej: sentadilla, remo, plancha" autocomplete="off"></label>
    <div class="chips" style="margin-top:10px">${['Todos',...GRUPOS,'Propios'].map(g=>`<button class="gchip" data-grupo="${esc(g)}" aria-pressed="${p.grupo===g}">${esc(g)}</button>`).join('')}</div>
    <div id="pgrid"></div>
    <div class="card stack" style="margin-top:14px">
      ${p.crear ? `<h3>Ejercicio nuevo</h3>
        <label for="cx-n">Nombre<input id="cx-n" placeholder="Ej: Pipito"></label>
        <label for="cx-g">Grupo<select id="cx-g">${GRUPOS.map(g=>`<option>${esc(g)}</option>`).join('')}</select></label>
        <label for="cx-t">Cómo se hace<textarea id="cx-t" style="min-height:60px" placeholder="Postura, recorrido, errores a evitar…"></textarea></label>
        <label for="cx-v">Link del video (opcional)<input id="cx-v" placeholder="https://youtu.be/…"></label>
        <div class="hint">La foto de la máquina se agrega después desde la pestaña Ejercicios.</div>
        <div class="row"><button class="btn dark" data-act="guardarPropio">Guardar y elegir</button><button class="btn ghost" data-act="toggleCrear">Cancelar</button></div>`
      : `<div class="hint">¿No está el que buscás?</div><button class="btn" data-act="toggleCrear">Crear ejercicio nuevo</button>`}
    </div>
  </div></div>
  <div class="sheet-foot"><span class="meta" id="pcount"></span><button class="btn primary" data-act="listoPicker">Agregar</button></div>`;
  renderPickerGrid();
}
function renderPickerGrid(){
  const p = S.picker; if(!p) return;
  const q = sinTildes(p.q);
  const items = LIB(false).filter(e => (p.grupo==='Todos' || (p.grupo==='Propios' ? !e.base : e.grupo===p.grupo)) && (!q || sinTildes(e.nombre).includes(q)));
  const g = document.getElementById('pgrid'); if(!g) return;
  g.innerHTML = items.length ? `<div class="pgrid">${items.map(e=>{ const on=p.sel.includes(e.key); return ejCard(e, `data-pick="${esc(e.key)}" aria-pressed="${on}"`).replace('</button>', `<div class="tag">${on?'✓ Elegido':'+ Elegir'}</div></button>`); }).join('')}</div>`
    : `<div class="empty" style="margin-top:12px">No hay ejercicios con ese nombre. Podés crearlo abajo.</div>`;
  document.getElementById('pcount').textContent = p.sel.length ? `${p.sel.length} elegido${p.sel.length>1?'s':''}` : 'Tocá los ejercicios para elegirlos';
  $sheet.querySelector('[data-act="listoPicker"]').disabled = !p.sel.length;
  cargarFotos(g);
}

/* ---------------- eventos ---------------- */
document.addEventListener('click', async ev => {
  const tip = ev.target.closest('[data-tip]');
  if(tip){ const c=document.getElementById(tip.dataset.cap); if(c) c.textContent = tip.dataset.tip; return; }
  const t = ev.target.closest('button,a'); if(!t) return;
  const act = t.dataset.act;
  if(act==='google'){ return loginGoogle(); }
  if(act==='logout'){ if(auth) await auth.signOut(); location.reload(); return; }
  if(TOKEN) return clickAlumno(t, act);
  if(S.picker) return clickPicker(t, act);
  return clickAdmin(t, act);
});

async function clickAlumno(t, act){
  if(t.dataset.altab){ AL.tab = t.dataset.altab; history.replaceState(null,'','#'+AL.tab); renderVA(); window.scrollTo(0,0); return; }
  if(t.dataset.dia !== undefined){ AL.dia = Number(t.dataset.dia); lsSet('dia_'+TOKEN, String(AL.dia)); renderVA(); window.scrollTo(0,0); return; }
  if(t.dataset.hecho){ const k=t.dataset.hecho; lsSet(k, lsGet(k)==='1' ? '0' : '1'); renderVA(); return; }
  if(t.dataset.metric){ AL.metric = t.dataset.metric; renderVA(); return; }
  const u = AL.user, pf = AL.perfil;
  switch(act){
    case 'demoLogin': loginDemo(); return renderVA();
    case 'authModo': AL.authModo = AL.authModo==='crear' ? 'entrar' : 'crear'; return renderVA();
    case 'olvide': { const m=(document.getElementById('lg-mail')||{}).value; if(!m){ toast('Escribí tu mail arriba y tocá de nuevo'); return; } try{ await auth.sendPasswordResetEmail(m); toast('Te mandamos un mail para crear una contraseña nueva'); }catch(e){ toast(errAuth(e.code)); } return; }
    case 'salirAlumno': if(DEMO){ lsSet('demo_user_'+TOKEN,'0'); AL.user=null; seguirPerfil(); return renderVA(); } await auth.signOut(); return;
    case 'fotoPerfil': return elegirArchivo({kind:'perfil'});
    case 'quitarFotoPerfil': { const p=clone(pf); p.foto=''; await guardar('perfiles', u.uid, p, 'Foto quitada'); return; }
    case 'borrarReg': { const p=clone(pf); p.registros.splice(Number(t.dataset.i),1); await guardar('perfiles', u.uid, p, 'Registro borrado'); return; }
  }
}

async function clickPicker(t, act){
  const p = S.picker;
  if(t.dataset.grupo){ p.grupo = t.dataset.grupo; $sheet.querySelectorAll('.gchip').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.grupo===p.grupo))); renderPickerGrid(); return; }
  if(t.dataset.pick){ const k=t.dataset.pick, i=p.sel.indexOf(k); if(i>=0) p.sel.splice(i,1); else p.sel.push(k); renderPickerGrid(); return; }
  if(act==='cerrarPicker') return cerrarPicker();
  if(act==='toggleCrear'){ p.crear=!p.crear; renderPicker(); return; }
  if(act==='guardarPropio'){
    const n=document.getElementById('cx-n').value.trim(); if(!n){ toast('Poné un nombre'); return; }
    const v=document.getElementById('cx-v').value.trim();
    if(v && !urlOk(v)){ toast('El link del video tiene que empezar con https://'); return; }
    const key='c:'+nuevoId('e');
    const data={nombre:n, grupo:document.getElementById('cx-g').value, tip:document.getElementById('cx-t').value.trim(), video:v, tieneFoto:false, oculto:false};
    if(await guardar('ejercicios', key, data, 'Ejercicio creado')){ EXDOCS[key]=data; refrescarLib(); p.sel.push(key); p.crear=false; p.grupo='Propios'; renderPicker(); }
    return;
  }
  if(act==='listoPicker'){
    const d = S.screen.draft.dias[p.dia];
    p.sel.forEach(k=>{ const e=LIBMAP[k]; if(e) d.items.push(itemDe(e)); });
    cerrarPicker(); renderAdmin(); return;
  }
}

async function clickAdmin(t, act){
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.screen=null; S.confirmDel=null; renderAdmin(); return; }
  if(t.dataset.exg){ S.exg=t.dataset.exg; renderAdmin(); return; }
  if(t.dataset.metric){ S.metric=t.dataset.metric; renderAdmin(); return; }
  const ir = scr => { S.screen=scr; S.confirmDel=null; renderAdmin(); window.scrollTo(0,0); };
  if(t.hasAttribute('data-back')){
    const s = S.screen;
    return ir(s && (s.type==='editRutina' && s.target==='alumno' || s.type==='avisar' || (s.type==='editAlumno' && s.id)) ? {type:'alumno', id:s.id} : null);
  }
  if(t.dataset.open) return ir({type:'alumno', id:t.dataset.open});
  if(t.dataset.plantilla) return ir({type:'editRutina', target:'plantilla', id:t.dataset.plantilla, draft:clone(S.plantillas[t.dataset.plantilla])});
  if(t.dataset.ej){ const e=LIBMAP[t.dataset.ej]; return ir({type:'editEj', draft:{key:e.key, base:e.base, editado:!!e.editado, nombre:e.nombre, grupo:e.grupo, tip:e.tip, video:e.video, tieneFoto:e.tieneFoto, oculto:e.oculto, fotoCambio:false, fotoData:''}}); }
  if(!act) return;
  const s = S.screen;
  switch(act){
    case 'nuevoAlumno': return ir({type:'editAlumno', id:null});
    case 'editAlumno': return ir({type:'editAlumno', id:s.id});
    case 'nuevaPlantilla': return ir({type:'editRutina', target:'plantilla', id:null, draft:rutinaVacia()});
    case 'nuevoEj': return ir({type:'editEj', draft:{key:null, base:false, nombre:'', grupo:'Otros', tip:'', video:'', tieneFoto:false, oculto:false, fotoCambio:false, fotoData:''}});
    case 'desdeCero': { const d=rutinaVacia(); d.inicio=today(); return ir({type:'editRutina', target:'alumno', id:s.id, archivar:!!S.alumnos[s.id].rutina, draft:d}); }
    case 'ajustar': return ir({type:'editRutina', target:'alumno', id:s.id, draft:clone(S.alumnos[s.id].rutina)});
    case 'renovar': { const d=clone(S.alumnos[s.id].rutina); d.inicio=today(); return ir({type:'editRutina', target:'alumno', id:s.id, archivar:true, draft:d}); }
    case 'asignar': { const d=clone(S.plantillas[document.getElementById('selPl').value]); d.inicio=today(); return ir({type:'editRutina', target:'alumno', id:s.id, archivar:!!S.alumnos[s.id].rutina, draft:d}); }
    case 'avisar': return ir({type:'avisar', id:s.id, primera:false, cambio:''});
    case 'agregarDia': s.draft.dias.push({titulo:'Día '+(s.draft.dias.length+1), items:[]}); return renderAdmin();
    case 'quitarDia': s.draft.dias.splice(Number(t.dataset.d),1); return renderAdmin();
    case 'abrirPicker': return abrirPicker(Number(t.dataset.d));
    case 'subir': case 'bajar': { const d=s.draft.dias[Number(t.dataset.d)].items, i=Number(t.dataset.i), j=act==='subir'?i-1:i+1; if(j<0||j>=d.length) return; [d[i],d[j]]=[d[j],d[i]]; return renderAdmin(); }
    case 'quitarIt': s.draft.dias[Number(t.dataset.d)].items.splice(Number(t.dataset.i),1); return renderAdmin();
    case 'copiarLink': return copiar(document.getElementById('linkAl'), 'Link copiado');
    case 'copiarMsg': return copiar(null, 'Mensaje copiado', mensajeAviso(S.alumnos[s.id], s.primera, s.cambio));
    case 'bajaAlumno': { const a=clone(S.alumnos[s.id]); a.activo = a.activo===false; if(await guardarAlumno(s.id, a)){ toast(a.activo?'Alumno dado de alta':'Alumno dado de baja'); renderAdmin(); } return; }
    case 'borrarAlumno': {
      if(S.confirmDel!==s.id){ S.confirmDel=s.id; return renderAdmin(); }
      const a=S.alumnos[s.id];
      try{ await Data.del('alumnos', s.id); if(a.token) await Data.del('publico', a.token); delete S.alumnos[s.id]; S.screen=null; S.confirmDel=null; toast('Alumno borrado'); renderAdmin(); }catch(e){ toast('No se pudo borrar'); }
      return;
    }
    case 'borrarPlantilla': {
      if(S.confirmDel!==s.id){ S.confirmDel=s.id; return renderAdmin(); }
      try{ await Data.del('plantillas', s.id); delete S.plantillas[s.id]; S.screen=null; S.confirmDel=null; S.tab='plantillas'; toast('Plantilla borrada'); renderAdmin(); }catch(e){ toast('No se pudo borrar'); }
      return;
    }
    case 'fotoEj': return elegirArchivo({kind:'ejercicio'});
    case 'quitarFotoEj': s.draft.fotoCambio=true; s.draft.fotoData=''; return renderAdmin();
    case 'bajaEj': { const d=s.draft; const doc=docEj(d); doc.oculto=!d.oculto; if(await guardar('ejercicios', d.key, doc, doc.oculto?'Ejercicio dado de baja':'Ejercicio dado de alta')){ EXDOCS[d.key]=doc; refrescarLib(); d.oculto=doc.oculto; d.editado=true; renderAdmin(); } return; }
    case 'borrarEj': case 'restaurarEj': {
      const k=s.draft.key; if(S.confirmDel!==k){ S.confirmDel=k; return renderAdmin(); }
      try{ await Data.del('ejercicios', k); await Data.del('fotos', k); delete EXDOCS[k]; delete FOTOS[k]; delete FOTO_PEND[k]; refrescarLib(); toast(act==='borrarEj'?'Ejercicio borrado':'Ejercicio restaurado'); S.tab='ejercicios'; ir(null); }catch(e){ toast('No se pudo completar'); }
      return;
    }
  }
}
const docEj = d => ({nombre:String(d.nombre||'').trim(), grupo:d.grupo, tip:String(d.tip||'').trim(), video:String(d.video||'').trim(), tieneFoto: d.fotoCambio ? !!d.fotoData : !!d.tieneFoto, oculto:!!d.oculto});
async function copiar(input, okMsg, texto){
  const val = texto ?? input.value;
  try{ await navigator.clipboard.writeText(val); toast(okMsg); }
  catch(e){ if(input){ input.focus(); input.select(); } toast('Mantené apretado para copiar'); }
}

document.getElementById('fileIn').addEventListener('change', async ev => {
  const f = ev.target.files && ev.target.files[0]; const tg = FILE_TARGET; FILE_TARGET = null;
  if(!f || !tg) return;
  try{
    if(tg.kind==='perfil'){
      const data = await comprimir(f, 360, 0.8);
      const p = clone(AL.perfil); p.foto = data; await guardar('perfiles', AL.user.uid, p, 'Foto guardada');
    } else if(tg.kind==='ejercicio'){
      const data = await comprimir(f, 900, 0.72);
      const s = S.screen; if(!s || s.type!=='editEj') return;
      s.draft.fotoCambio = true; s.draft.fotoData = data; renderAdmin();
    }
  }catch(e){ toast('No se pudo usar esa imagen. Probá con otra.'); }
});

document.addEventListener('change', ev => {
  if(ev.target.id==='exBajas'){ S.exBajas = ev.target.checked; renderAdmin(); }
  const s = S.screen;
  if(s && s.type==='editEj' && ev.target.dataset.x) s.draft[ev.target.dataset.x] = ev.target.value;
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if(S.picker && t.id==='pq'){ S.picker.q = t.value; renderPickerGrid(); return; }
  if(t.id==='q'){ S.q = t.value; document.getElementById('listaAl').innerHTML = listaAlumnosHTML(); return; }
  if(t.id==='exq'){ S.exq = t.value; const g=document.getElementById('exGrid'); g.innerHTML = ejFiltrados(S.exBajas).map(e=>ejCard(e, `data-ej="${esc(e.key)}"`)).join(''); cargarFotos(g); return; }
  const s = S.screen; if(!s) return;
  if(s.type==='avisar' && t.id==='cambio'){ s.cambio = t.value; actualizarAviso(); return; }
  if(s.type==='editEj' && t.dataset.x){ s.draft[t.dataset.x] = t.value; if(t.dataset.x==='video'){ document.getElementById('vidPrev').innerHTML = urlOk(t.value)?videoHTML(t.value):''; } return; }
  if(s.type!=='editRutina') return;
  if(t.dataset.r){ s.draft[t.dataset.r] = t.dataset.r==='semanas' ? (Number(t.value)||'') : t.value; return; }
  if(t.dataset.dt!==undefined){ s.draft.dias[Number(t.dataset.dt)].titulo = t.value; return; }
  if(t.dataset.f){ s.draft.dias[Number(t.dataset.d)].items[Number(t.dataset.i)][t.dataset.f] = t.value; }
});

document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const id = ev.target.id, s = S.screen;
  if(id==='fLogin'){
    const m=document.getElementById('lg-mail').value.trim(), pw=document.getElementById('lg-pass').value;
    try{ if(AL.authModo==='crear') await auth.createUserWithEmailAndPassword(m, pw); else await auth.signInWithEmailAndPassword(m, pw); }
    catch(e){ toast(errAuth(e.code)); }
    return;
  }
  if(id==='fReg'){
    const r = {fecha: document.getElementById('rg-fecha').value || today()};
    let alguno = false;
    CAMPOS.forEach(([c]) => { const v = num(document.getElementById('rg-'+c).value); r[c] = v==null ? '' : String(v); if(v!=null) alguno = true; });
    if(!alguno){ toast('Completá al menos un dato'); return; }
    const p = clone(AL.perfil); p.registros = (p.registros||[]).concat([r]).slice(-300);
    await guardar('perfiles', AL.user.uid, p, 'Registro guardado');
    return;
  }
  if(id==='fDatos'){
    const p = clone(AL.perfil);
    Object.assign(p, {nombre:document.getElementById('pd-nombre').value.trim(), nacimiento:document.getElementById('pd-nac').value, altura:document.getElementById('pd-alt').value.trim(), telefono:document.getElementById('pd-tel').value.trim(), emergencia:document.getElementById('pd-emer').value.trim(), molestias:document.getElementById('pd-mol').value.trim()});
    await guardar('perfiles', AL.user.uid, p, 'Datos guardados');
    return;
  }
  if(id==='fAl'){
    const nombre = document.getElementById('al-nombre').value.trim(); if(!nombre) return;
    const aid = s.id || nuevoId('a');
    const a = s.id ? clone(S.alumnos[s.id]) : {historial:[], token:nuevoToken(nombre), activo:true, rutina:null, actualizada:null};
    Object.assign(a, { nombre, telefono:document.getElementById('al-tel').value.trim(), objetivo:document.getElementById('al-obj').value.trim(), alta:document.getElementById('al-alta').value, observaciones:document.getElementById('al-obs').value.trim() });
    if(await guardarAlumno(aid, a)){ toast('Guardado'); S.screen={type:'alumno', id:aid}; renderAdmin(); }
    return;
  }
  if(id==='fEj'){
    const d = s.draft; const doc = docEj(d);
    if(!doc.nombre){ toast('Poné un nombre'); return; }
    if(doc.video && !urlOk(doc.video)){ toast('El link del video tiene que empezar con https://'); return; }
    const key = d.key || 'c:'+nuevoId('e');
    try{
      if(d.fotoCambio){ if(d.fotoData) await Data.set('fotos', key, {img:d.fotoData}); else await Data.del('fotos', key); FOTOS[key] = d.fotoData || null; FOTO_PEND[key] = Promise.resolve(FOTOS[key]); }
      await Data.set('ejercicios', key, doc);
      EXDOCS[key] = doc; refrescarLib(); toast('Ejercicio guardado'); S.screen=null; S.tab='ejercicios'; renderAdmin(); window.scrollTo(0,0);
    }catch(e){ console.error(e); toast('No se pudo guardar. Si subiste una foto, probá con otra más liviana.'); }
    return;
  }
  if(id==='fR'){
    const r = clone(s.draft);
    r.nombre = String(r.nombre||'').trim(); if(!r.nombre){ toast('Ponele nombre a la rutina'); return; }
    r.semanas = Math.max(1, Number(r.semanas)||4);
    r.dias = (r.dias||[]).map((d,i)=>({titulo:String(d.titulo||'').trim()||('Día '+(i+1)), items:d.items||[]}));
    if(s.target==='plantilla'){
      delete r.inicio;
      const pid = s.id || nuevoId('p');
      if(await guardar('plantillas', pid, r, 'Plantilla guardada')){ S.plantillas[pid]=r; S.screen=null; S.tab='plantillas'; renderAdmin(); window.scrollTo(0,0); }
      return;
    }
    const a = clone(S.alumnos[s.id]); const primera = !a.rutina;
    r.inicio = r.inicio || today();
    a.historial = a.historial || [];
    if(s.archivar && a.rutina){ a.historial.push(Object.assign(clone(a.rutina), {fin:r.inicio})); if(a.historial.length>30) a.historial = a.historial.slice(-30); }
    a.rutina = r; a.actualizada = new Date().toISOString();
    if(await guardarAlumno(s.id, a)){ toast('Rutina guardada'); S.screen={type:'avisar', id:s.id, primera, cambio:''}; renderAdmin(); window.scrollTo(0,0); }
  }
});

/* ---------------- arranque ---------------- */
refrescarLib();
if(TOKEN) startAlumno();
else if(DEMO) startAdmin();
else startLogin();
</script>
